name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check shell syntax
        run: |
          /bin/bash -n link_configs.sh
          sh -n yabai/yabairc
          zsh -n zshrc
          zsh -n yabai/yabai-restart
      - name: Run isolated regression tests
        run: python3 -B -m unittest discover -s tests -v

  lua-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: '2.5.2'
          args: --check nvim
