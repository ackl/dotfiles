# Shared configuration for macOS and Omarchy Linux.
# Base4Tone is the fallback; Omarchy's current theme overrides it when present.
include current-theme.conf
geninclude runtime.py

# Use Zsh even when the desktop session exports an older login shell.
shell /bin/zsh -l
env SHELL=/bin/zsh

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 1

# Cursor and scrolling
cursor_shape block
cursor_blink_interval 0.5
shell_integration no-cursor
enable_audio_bell no
scrollbar_interactive yes
scrollbar_jump_on_click yes
dynamic_background_opacity yes

# Clipboard and distinguishable Shift-Enter combinations for terminal apps.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u

# Socket location is generated by runtime.py above.
allow_remote_control yes

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
